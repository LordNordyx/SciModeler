name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (.msi)
          - os: macos-latest
            name: macOS Apple Silicon (.dmg)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and package
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test packageDistributionForCurrentOS --no-daemon 2>&1 | tee build.log

      - name: Publish UI screenshots
        if: always() && matrix.os == 'windows-latest' && github.event_name == 'push'
        shell: bash
        run: |
          [ -d build/screenshots ] || exit 0
          mkdir -p /tmp/shots && cp -r build/screenshots/. /tmp/shots/
          cd /tmp/shots
          git init -q && git checkout -q -b ci-screenshots
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screenshots

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -iE "POINTER CLICK|^e: |error|FAILED|What went wrong|exception|expected|at scimodeler\.|Caused by" build.log | grep -v "^\s*at org\.\|at java\.\|at kotlin\." | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SciModeler-${{ runner.os }}
          path: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: ver
        run: echo "v=$(grep '^appVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          name: SciModeler ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/**/*.msi
            dist/**/*.dmg
          make_latest: true
          generate_release_notes: true
